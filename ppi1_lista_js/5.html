
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio de Números</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 8px;
            margin: 5px;
            width: 100px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            margin: 10px;
        }

        #resultado {
            font-size: 24px;
            font-weight: bold;
        }

        #historico {
            list-style: none;
            padding: 0;
        }

        #historico li {
            margin: 8px;
        }
    </style>

</head>

<body>
    <h1>Sorteio de Números</h1>

    <label for="min">Valor mínimo:</label>
    <input type="number" id="min" placeholder="Mínimo">
    <br>

    <label for="max">Valor máximo:</label>
    <input type="number" id="max" placeholder="Máximo">
    <br>

    <button id="btnSortear">Sortear</button>
    <p id="resultado">Resultado: -</p>

    <h2>Histórico</h2>
    <ul id="historico"></ul>

    <script>
        let numerosSorteados = [];

        const min = document.getElementById("min");
        const max = document.getElementById("max");
        const resultado = document.getElementById("resultado");
        const historico = document.getElementById("historico");
        const btnSortear = document.getElementById("btnSortear");

        function sortear() {
            const minimo = Number(min.value);
            const maximo = Number(max.value);

            if (min.value === "" || max.value === "" || minimo > maximo) {
                resultado.innerText = "Informe um intervalo válido!";
                return;
            }

            const numero = Math.floor(Math.random() * (maximo - minimo + 1)) + minimo;

            let encontrado = numerosSorteados.find( item => item.numero === numero );

            if (encontrado) {encontrado.quantidade++; }
            else {
                numerosSorteados.push({
                    numero: numero,
                    quantidade: 1
                });
            }
            resultado.innerText = "Número sorteado: " + numero;
            historico.innerHTML = "";

            numerosSorteados.forEach(item => {
                const li = document.createElement("li");
                li.innerText = item.numero + " - Sorteado " + item.quantidade + " vez(es)";
                historico.appendChild(li);

            });
            console.log(numerosSorteados);
        }
        btnSortear.addEventListener("click", sortear);

    </script>

</body>
</html>
