<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <style>
        *{
            border:1px solid black
        }
        div{
            display: inline-block;
            height: 50px;
            width: 70px;
        }
        p{
            display: none;
        }
        span{
            display: inline-block;
        }
        #container{
            width: 100%;
            height: 500px;
        }
        .box{
            display: inline-block;
        }
        #box1{
            background-color: greenyellow;
            position: relative;
            top: 50px;
        }
        #box2{
            background-color: rgb(44, 104, 173);
            position: relative;
            top: 50px;
            z-index: 3;
        }
        #box3{
            background-color: rgb(112, 10, 61);
            position: relative;
            top: 50px;
        }
        #box4{
            background-color: rgb(65, 16, 179);
            position: relative;
            top: 50px;
        }
    </style>
<body>
    <div>Lorem div</div>
    <div>Lorem div</div>
    <p>Lorem P</p>
    <p>Lorem P</p>
    <span>Lorem span</span>
    <span>Lorem span</span>

    <hr>
    <h2>Position</h2>
    <div id="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
    </div>
</body>
</html>
