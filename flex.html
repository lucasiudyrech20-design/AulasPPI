<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex (linha/coluna)</title>
    <style>
        .container, .box{border: 1px solid black;}
        .container{display: flex;
        justify-content: center;
        flex-direction: row;
        align-items: center;
        height: 100vh;}
        #box3{order: -1;
        flex-grow: 1;}
        #box3{ flex-grow: 1;}
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">box1</div>
        <div class="box" id="box2">box2</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
        <div class="box" id="box5">box5</div>
    </div>
    <div> 
        <h1><a href="https://css-tricks.com/snippets/css/a-guide-to-flexbox/#css-flexbox-properties">CSS TRICKS</a></h1>
    </div>
    
</body>
</html>
