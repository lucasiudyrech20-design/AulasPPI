<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sortear numero</title>

    <style>
        .container{
            display: flex;
            height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-content: center;
        }
        .inputs{
            display: flex;
            flex-direction: column;
        }

    </style>
</head>
<body>
    <div class="container">

        <div class="inputs">
            <label for="">Minimo</label>
            <input type="number" id="min">
            </div>

            <div class="inputs">
                <label for="">Maximo</label>
            <input type="number" id="max">
            </div>

            <br>
            <button id="sortear">Sortear</button>
            <h2 class="result">-</h2>
    </div>

    <script>
        const btnSortear = document.getElementById("Sortear");
        const min = document.getElementById("min");
        const max = document.getElementById("max");
        const result = document.querySelector(".result");

        btnSortear.addEventListener("click", () => {
            const minimo = Number.parseFloat(min.value);
            const maximo = Number.parseFloat(max.value);
            const random = Math.floor(Math.random()*(maximo - minimo + 1)) + minimo;
            result.innerHTML = random;

        });

    </script>
    
</body>
</html>
