<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .contaner{
            display: flex;
            height: 100vh;
            flex-direction: column;
            justify-content: center;
            align-content: center;
        }
        .inputs{
            display: flex;
            flex-direction: column;
        }

    </style>
</head>
<body>
    <div class="container">

        <div class="inputs">
            <label for="">Minimo</label>
            <input type="number" id="min">
            </div>

            <div class="inputs">
                <label for="">Maximo</label>
            <input type="number" id="max">
            </div>

            <br>
            <button>Sortear</button>
            <h2 class="result">-</h2>
    </div>

    <script>
        btnSortear.addEventLitener("click", ()=>{
            minimo= Number.parseFloat(min.value)// value para não pegar o bloco inteiro
            maximo= Number.parseFloat(max.value)
            random = (Math.random()*(maximo-minimo))+minimo;
            result.innerHTML=random;
        })

    </script>
    
</body>
</html>
