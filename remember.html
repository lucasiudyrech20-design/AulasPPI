<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
    div{    border: 2px solid black;   }
    .box{border: 3px solid red;
    display: inline-block;
    width: 100px;
    height: 100px;}

    #box1{background-color: blue;
    position: relative;
    top: 10px;
    left: 10px;}

    #box2{background-color: pink;
    position: relative;
    top: -30px;
    left: -30px;}

    #box3{background-color: rgb(0, 255, 64);
    position: fixed;
    top: 0px;
    left: 0px;}

    #box4{background-color: rgb(255, 0, 234);
    position: absolute;
    top: 220px;
    left: 600px;}

    #box5{background-color: rgb(255, 251, 0);
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

</style>

</head>
<body>
    div#box$.box{box$}*5
    <h1>Position</h1>
    <div class="container">
        <div id="box1" class="box">box1</div>
        <div id="box2" class="box">box2</div>
        <div id="box3" class="box">box3</div>
        <div id="box4" class="box">box4</div>
        <div id="box5" class="box">box5</div>

    </div>


</body>
</html>
